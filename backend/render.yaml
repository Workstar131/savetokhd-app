services:
  - type: web
    name: tiktokextract-api
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://savetokhd-app.onrender.com,http://localhost:5500"
    healthCheckPath: /api/health
    autoDeploy: true
